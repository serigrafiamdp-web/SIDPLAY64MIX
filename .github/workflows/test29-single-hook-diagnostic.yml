name: TEST29 single Glenn/Krill hooks, diagnostic trace (VICE pending)
on:
  push:
    branches: [test/test29-single-hook-prefetch-diagnostics]
    paths:
      - '.github/workflows/test29-one-prg.yml'
      - 'sidplay64.tas'
      - 'src/mix10_glenn_symbiont.tas'
      - 'tools/test29_pack.py'
      - 'src/mix10_glenn_symbiont.tas'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen TEST19 disk for Krill payloads and SID data
        uses: actions/checkout@v4
        with:
          ref: master
          path: frozen-master
          persist-credentials: false
      - name: Install original assembler and packer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 64tass build-essential zip
          git clone --depth=1 https://github.com/mist64/pucrunch.git /tmp/pucrunch-src
          make -C /tmp/pucrunch-src
      - name: Extract Krill installer and resident exactly from PASS TEST19
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from tools.test29_pack import files
          root=Path('frozen-master/MASTERS/2026-10-27_PASS/TEST19_MULTIPLES_ARCHIVOS_KRILL_5_SEGUNDOS.d64')
          b=root.read_bytes()
          assert hashlib.sha256(b).hexdigest() == 'b247f58ce9d3df87025d0f09ca145998bffe31e8f9e520c5c29dcfc238d66cc5'
          fs=dict(files(b))
          assert fs['INSTA'][:2]==b'\x00\x60' and len(fs['INSTA'])==6888
          assert fs['RESIDENT'][:2]==b'\x00\x90' and len(fs['RESIDENT'])==497
          Path('assets').mkdir(exist_ok=True)
          Path('assets/krill_insta_payload.bin').write_bytes(fs['INSTA'][2:])
          Path('assets/krill_resident_payload.bin').write_bytes(fs['RESIDENT'][2:])
          print('Krill installer: $6000',len(fs['INSTA'])-2,'bytes')
          print('Krill resident: compiled for $9000, staged at $8800',len(fs['RESIDENT'])-2,'bytes')
          PY
      - name: Normalize only legacy 64tass include syntax in working source
        run: |
          printf '27.10.2026 00:00\r\n' > timedate.clk
          python3 tools/normalize_tass_includes.py
      - name: Assemble real Glenn+Krill into one C64 executable
        run: |
          mkdir -p build/test29
          64tass --m6502 -D defset=4 -D DEF_SIDFX=0 -D DEF_REU=0 -D DEF_MIX03=0 -D DEF_MIX10=1 -a sidplay64.tas -o build/test29/SIDPLAY64MIX.O64 -l build/test29/SIDPLAY64MIX.labels
          /tmp/pucrunch-src/pucrunch '-x$9000' build/test29/SIDPLAY64MIX.O64 build/test29/SIDPLAY64MIX.PRG
      - name: Build and byte-verify D64 with ONLY the PRG and 19 original SIDs
        run: |
          python3 tools/test29_pack.py --master frozen-master/MASTERS/2026-10-27_PASS/TEST19_MULTIPLES_ARCHIVOS_KRILL_5_SEGUNDOS.d64 --prg build/test29/SIDPLAY64MIX.PRG --output build/test29/SIDPLAY64MIX_TEST29.D64 --report build/test29/REPORT.json
      - name: Include complete ASM source and resources, no Windows EXE in ZIP
        run: |
          mkdir -p build/test29/PROJECT/src build/test29/PROJECT/bin build/test29/PROJECT/assets
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('build/test29/PROJECT')
          for pat in ['src/**/*.tas','bin/*.o64']:
              for f in Path('.').glob(pat):
                  dest=root/f
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(f,dest)
          for f in ['sidplay64.tas','sidplay64.cfg','timedate.clk','tools/normalize_tass_includes.py','tools/test29_pack.py','assets/krill_insta_payload.bin','assets/krill_resident_payload.bin']:
              dest=root/f
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(f,dest)
          assert not list(root.rglob('*.exe'))
          print('Included ASM sources',len(list(root.rglob('*.tas'))))
          PY
          cp build/test29/SIDPLAY64MIX.PRG build/test29/SIDPLAY64MIX_TEST29.D64 build/test29/REPORT.json build/test29/PROJECT/
          cat > build/test29/PROJECT/LEEME.txt <<'EOF'
          TEST29: 1 PRG + 19 SID, UN SOLO SISTEMA DE HOOKS. PRUEBA, NO PASS VICE.\n          Monitor VICE durante cancion: m $3ff0 $3ff7\n          $3ff0=01 preparacion Krill; $3ff1=12 activacion exitosa.\n          $3ff2=04 precarga exitosa; FF error; 03 intento; 00 no ejecutada.\n          $3ff3 segundos CIA TOD; $3ff4 SID actual; $3ff5 siguiente SID.
          Glenn real + hooks Krill. Installer/Resident incrustados en PRG
          con 64tass y empaquetado PuCrunch.
          El ZIP contiene fuentes ASM y binarios C64, NO .EXE de Windows.
          Abrir SIDPLAY64MIX_TEST29.D64 en VICE C64 limpio:
            LOAD"*",8,1
            RUN
          Verificar intro, scroll, canciones, precarga 5 s M/N, bordes.
          TEST25 PASS y TEST19 PASS permanecen intactos.
          Restricción actual: 19 SID del test con LOAD/INIT $1000, PLAY $1003.
          Soporte genérico de PSID/RSID pendiente de memoria/compatibilidad.
          EOF
          (cd build/test29/PROJECT && zip -qr ../SIDPLAY64MIX_TEST29_PROYECTO_COMPLETO.zip .)
      - name: Archive TEST29 for testing (not a PASS)
        uses: actions/upload-artifact@v4
        with:
          name: SIDPLAY64MIX_TEST29_SINGLE_PRG_NOT_VICE_PASS
          path: |
            build/test29/SIDPLAY64MIX_TEST29.D64
            build/test29/SIDPLAY64MIX_TEST29_PROYECTO_COMPLETO.zip
            build/test29/REPORT.json
          if-no-files-found: error
      - name: Publish test binaries to experimental branch (never master)
        run: |
          mkdir -p TESTS/TEST29
          cp build/test29/SIDPLAY64MIX_TEST29.D64 build/test29/SIDPLAY64MIX_TEST29_PROYECTO_COMPLETO.zip build/test29/REPORT.json TESTS/TEST29/
          git add TESTS/TEST29/
          git -c user.name='SIDPLAY64 native build bot' -c user.email='sidplay64-build@users.noreply.github.com' commit -m 'test29: build 1 Glenn+Krill PRG + 19 original SID (VICE pending)' || true
          git push origin HEAD:test/test29-single-hook-prefetch-diagnostics
