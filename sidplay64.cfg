;--------------------------------------------------------------
;         SIDPLAY 64 configuration
;--------------------------------------------------------------
;compile like this:
;64tass --m6502 -D defset=1 -a sidplay64.tas -o sidplay64-normal.o64


;*** NORMAL build (1541 serial drives and clones) ***
.if defset = 1		
IOMessages	= 1	;drive messeages.
def_1541u2cmd	= 0
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0	;1541u2 - software iec
DEF_CHAMELEON   = 0
.fi

;*** 1541UII Command Interface version ***
.if defset = 2		
IOMessages	= 0	;device messages.
def_1541u2cmd	= 1	;cmd
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
DEF_CHAMELEON   = 0
.fi

;*** *IEC, IDE64 & CMD FD/HD/RL/RD drives. ***
.if defset = 3		
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
DEF_CHAMELEON   = 0
.fi


;*** SD2IEC mode (handles disk images, d81, d64 etc) ***
.if defset = 4		
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 1
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
DEF_CHAMELEON   = 0
.fi


;*** 1541U1 & NETDRIVE ***
.if defset = 5
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 0
def_1541u	= 1
def_1541u_long	= 1
def_1541u2siec	= 0
DEF_CHAMELEON   = 0
.fi


;*** Chameleon with normal build (serial drives) ***
.if defset = 6		
IOMessages	= 1	;drive messeages.
def_1541u2cmd	= 0
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
DEF_CHAMELEON   = 1
.fi


;*** CHAMELEON in sd2iec mode (handles disk images, d81, d64 etc) ***
.if defset = 7
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 1
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
DEF_CHAMELEON   = 1
.fi



;*** NOT in USE : 1541u2siec build (replaced by 1541u2cmd version above) ***
.if defset = 99		
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 1	;1541u2 - software iec
DEF_CHAMELEON   = 0
.fi



