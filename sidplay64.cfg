;--------------------------------------------------------------
;         SIDPLAY 64 configuration
;--------------------------------------------------------------
;compile like this:
;64tass --m6502 -D defset=1 -a sidplay64.tas -o sidplay64-normal.o64

.if defset = 1		;1 = normal build (serial drives)
IOMessages	= 1	;drive messeages.
def_1541u2cmd	= 0
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0	;1541u2 - software iec
.fi

.if defset = 2		;2 = 1541u2cmd build
IOMessages	= 0	;device messages.
def_1541u2cmd	= 1	;cmd
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
.fi

.if defset = 3		;3 = *IEC, IDE64 & CMD FD/HD/RL/RD drives.
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
.fi

.if defset = 4		;4 = sd2iec mode (handles disk images, d81, d64 etc)
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 1
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 0
.fi

.if defset = 5		;5 = 1541u1 & netdrive
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 1
def_sd2iec	= 0
def_1541u	= 1
def_1541u_long	= 1
def_1541u2siec	= 0
.fi

.if defset = 6		;7 = 1541u2siec build (replaced by 1541u2cmd version)
IOMessages	= 1	;device messages.
def_1541u2cmd	= 0
def_iec		= 0
def_sd2iec	= 0
def_1541u	= 0
def_1541u_long	= 0
def_1541u2siec	= 1	;1541u2 - software iec
.fi




